<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>inba.dev | mobile continuous story reference</title>
  <style>
    /* Mobile reference for EXPERIENCE.md Responsive & Platform. The embedded
       canonical mock is rendered at 390 CSS pixels. Spines win on conflict. */
    :root{--paper:#f1eee7;--ink:#102536}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#d7d3ca;color:var(--ink);font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif}
    .review-shell{width:min(100%,430px)}
    .review-note{display:flex;justify-content:space-between;gap:16px;margin-bottom:10px;font:600 10px/1.4 ui-monospace,"IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.review-note span:last-child{color:#596872}
    .phone{width:100%;height:min(860px,calc(100vh - 86px));padding:10px;border-radius:28px;background:var(--ink);box-shadow:0 24px 70px rgba(16,37,54,.24)}
    iframe{display:block;width:390px;max-width:100%;height:100%;margin:auto;border:0;border-radius:19px;background:var(--paper)}
    .hint{margin:10px 0 0;text-align:center;font:500 10px/1.4 ui-monospace,"IBM Plex Mono",monospace;color:#596872}
    @media(max-width:470px){body{padding:0;background:var(--paper)}.review-shell{width:100%;height:100vh}.review-note,.hint{display:none}.phone{width:100%;height:100vh;padding:0;border-radius:0;box-shadow:none}.phone iframe{width:100%;border-radius:0}}
  </style>
</head>
<body>
  <main class="review-shell">
    <div class="review-note"><span>Mobile continuous story</span><span>390px · natural scroll</span></div>
    <div class="phone"><iframe src="key-continuous-desktop-story.html" title="Mobile-width preview of the seven-chapter inba.dev portfolio mock"></iframe></div>
    <p class="hint">Scroll inside the paper canvas to review every chapter.</p>
  </main>
</body>
</html>
